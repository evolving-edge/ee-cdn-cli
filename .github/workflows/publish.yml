# Ships whatever version lands on main, if the registry does not have it yet.
#
# It does NOT decide the version. version.yml and Changesets do that: each PR
# carries a changeset, and merging the "Version Packages" PR is what bumps
# package.json and writes CHANGELOG.md. Merging that PR is therefore the
# release, and this workflow is what carries it out. Every other push to main
# is a no-op, because the decision is made by asking the registry rather than
# by diffing the previous commit -- so a re-run, a revert and an unrelated
# merge all behave the same.
#
# WHETHER IT PUBLISHES OR STAGES DEPENDS ON THE TRUSTED PUBLISHER, and the run
# summary says which happened rather than leaving green to be read as shipped.
# See the step below.
#
# ---------------------------------------------------------------------------
# AUTHENTICATION: npm trusted publishing (OIDC). There is no token. GitHub
# mints a short-lived credential that npm verifies against the trusted
# publisher configured for this package, so nothing long-lived exists to leak.
#
# THIS STAGES, IT DOES NOT PUBLISH. `npm stage publish` uploads the version and
# leaves it pending until a maintainer approves it with 2FA, at npmjs.com ->
# Staged Packages, or `npm stage approve <id>`. Until then it is not
# installable.
#
# That is not a preference, it is what the trusted publisher permits. Allowed
# actions on a trusted publisher default to staging only; direct `npm publish`
# is a separate, unticked box. A workflow calling `npm publish` against a
# default configuration fails with "403 OIDC permission denied for this
# action", which reads like an identity problem and is not -- npm matched the
# identity and refused the verb. Staging is permitted by every configuration,
# so this cannot break that way again.
#
# To make releases fully automatic instead: tick `npm publish` under Allowed
# actions, and change the one step below back to `npm publish`. The trade is a
# human approval per release against a workflow that can push straight to the
# registry.
#
# Keep at least two people holding `owner` on the npm org. That, not the token
# strategy, is what actually fixes the bus factor.
# ---------------------------------------------------------------------------

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

# Deliberately NO concurrency group. GitHub keeps only one running and one
# pending run per group, so a third push evicts the pending one even with
# cancel-in-progress: false -- and if the evicted run was the one carrying a
# version bump, that version is silently never published. Letting every push
# run means the worst case is two runs racing on the same version, where npm
# rejects the loser with EPUBLISHCONFLICT. A red run that names the problem is
# a better failure than a release that quietly never happened.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # trusted publishing needs node >=22.14 / npm >=11.5.1
          registry-url: 'https://registry.npmjs.org'

      # workflow_dispatch lets a maintainer pick any branch, and the checkout
      # above would then publish that branch's package.json -- shipping code
      # that was never reviewed or merged. The trigger is kept because it is
      # genuinely useful for re-running after the bootstrap below, but it is
      # main or nothing.
      - name: Refuse to publish from anywhere but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to publish from $GITHUB_REF — releases come from main only."
            exit 1
          fi

      # `npm stage` landed in npm 12; the Node 24 runner ships npm 11.
      - name: Install an npm that has `npm stage`
        run: |
          npm install -g npm@^12
          npm --version

      - run: npm ci
      - run: npm test

      # Asking the registry, rather than diffing against the previous commit,
      # means a re-run, a revert and a merge that touched nothing relevant all
      # behave identically: if this version is already out there, stop.
      - name: Decide whether this version needs publishing
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 0 if the spec exists, 1 if the registry actually says 404, and the
          # job fails on anything else. Treating every npm view failure as
          # "never published" would turn a DNS blip or a registry outage into
          # advice to hand-publish a package that already exists.
          exists() {
            local spec="$1" out
            if out="$(npm view "$spec" version 2>&1)"; then
              return 0
            fi
            if printf '%s' "$out" | grep -q 'code E404'; then
              return 1
            fi
            echo "::error::npm view $spec failed for a reason other than a missing package."
            printf '%s\n' "$out"
            exit 1
          }

          if ! exists "$NAME"; then
            # Cannot happen now that the package exists, so treat it as the
            # registry misbehaving rather than as a bootstrap to perform.
            echo "::error::$NAME reports as unpublished, which should be impossible — refusing to guess. See the npm output above."
            exit 1
          elif exists "$NAME@$VERSION"; then
            echo "$NAME@$VERSION is already on the registry — nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on the registry — publishing."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish if the trusted publisher allows it, stage if it does not.
      #
      # Allowed actions on a trusted publisher default to staging only, and
      # direct `npm publish` is a separate, unticked box. So a workflow hard-
      # coded to `npm publish` fails with "403 OIDC permission denied for this
      # action" on a default configuration -- npm matched the identity and
      # refused the verb -- and a workflow hard-coded to `npm stage publish`
      # leaves a manual approval in the path forever, even after somebody
      # ticks the box.
      #
      # Trying publish first and falling back is what makes this correct under
      # both configurations, and makes ticking the box the ONLY thing needed to
      # go fully automatic -- no code change, no second PR. The fallback is
      # narrow on purpose: only a 403 naming this action falls through. Every
      # other failure, including a 403 for any other reason, fails the job.
      - name: Publish, or stage if that is all the publisher permits
        id: publish
        if: steps.check.outputs.needed == 'true'
        run: |
          set -o pipefail
          if npm publish 2>&1 | tee /tmp/publish.log; then
            echo "mode=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'permission denied for this action' /tmp/publish.log; then
            echo "::notice::Trusted publisher does not allow direct publish; staging instead."
            npm stage publish
            echo "mode=staged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::npm publish failed for a reason other than the allowed-actions setting."
          exit 1

      # A publish failure on npm is almost never what the error text says, so
      # this branches on the code rather than asserting the likeliest cause.
      #
      # The previous version named ONE cause -- a token scoped to selected
      # packages -- and stated it confidently. When this job actually failed the
      # cause was a stage-only trusted publisher, and the token was not even in
      # play, so the diagnosis sent the reader off to reissue a PAT that had
      # nothing to do with it. A confident wrong answer costs more than none.
      - name: Explain the failure
        if: always() && steps.publish.outcome == 'failure'
        run: |
          LOG="$(ls -t "$HOME"/.npm/_logs/*.log 2>/dev/null | head -1)"
          ERR="$(grep -oE 'code (E[A-Z0-9]+)' "$LOG" 2>/dev/null | head -1 | awk '{print $2}')"
          {
            echo "### Staging failed: \`${ERR:-unknown}\`"
            echo
            case "$ERR" in
              E403)
                echo "npm matched the OIDC identity and refused the **action**."
                echo
                echo "Every trusted publisher permits \`npm stage publish\` by default, so this"
                echo "usually means the configuration no longer matches this workflow: check that"
                echo "**Repository** is \`ee-cdn-cli\`, **Workflow** is \`publish.yml\` and"
                echo "**Environment** is empty, under npmjs.com -> Packages -> the package ->"
                echo "Settings -> Trusted publishing."
                echo
                echo "If it says \"permission denied for this action\" the verb is the problem,"
                echo "not the identity -- confirm **Allowed actions** still lists \`npm stage publish\`."
                ;;
              E404)
                echo "A 404 on a PUT is npm declining to say whether the package exists."
                echo
                echo "It means this credential may not write to the \`@evolving-edge\` scope. Under"
                echo "OIDC that points at the trusted publisher; with a token it means the token is"
                echo "scoped to selected packages and cannot create or update this one."
                ;;
              EPUBLISHCONFLICT|EEXIST)
                echo "This version is already on the registry."
                echo
                echo "Two runs raced, or someone published by hand. Harmless -- bump the version in"
                echo "\`package.json\` and merge again. Nothing was overwritten; npm does not allow it."
                ;;
              EOTP)
                echo "npm asked for a one-time password, which CI cannot supply."
                echo
                echo "That means the run authenticated with a token rather than OIDC. Check that"
                echo "\`id-token: write\` is still set on this job and the trusted publisher still exists."
                ;;
              ENEEDAUTH)
                echo "No credential reached npm at all. Check \`id-token: write\` on this job."
                ;;
              *)
                echo "Not a failure mode this step recognises, so here is the log rather than a guess."
                ;;
            esac
            echo
            echo "<details><summary>npm log</summary>"
            echo
            echo '```'
            tail -40 "$LOG" 2>/dev/null || echo "(no npm log found)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          NAME="${{ steps.check.outputs.name }}"
          VERSION="${{ steps.check.outputs.version }}"
          MODE="${{ steps.publish.outputs.mode }}"
          if [ "${{ steps.check.outputs.needed }}" != "true" ]; then
            echo "No release: \`$NAME@$VERSION\` is already on the registry." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = "published" ]; then
            echo "### Published \`$NAME@$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Live on the registry and installable now." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Staged \`$NAME@$VERSION\` — NOT installable yet"
              echo
              echo "The trusted publisher permits staging but not direct publish, so this run"
              echo "uploaded the version and stopped. **Green here does not mean shipped.**"
              echo
              echo "Approve it with 2FA:"
              echo
              echo '```'
              echo "npm stage list $NAME"
              echo "npm stage approve <stage-id>"
              echo '```'
              echo
              echo "or at npmjs.com -> Staged Packages."
              echo
              echo "To make releases fully automatic, tick \`npm publish\` under **Allowed"
              echo "actions** on the trusted publisher. No code change is needed -- this"
              echo "workflow publishes directly whenever it is permitted to."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
